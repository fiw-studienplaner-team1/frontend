<div class="moduleplanner-container">
    <div class="moduleplanner-header">
        <h4>Studienverlauf</h4>
        <h2>Mein Modulplan</h2>
        <h6>Plane deinen nächsten Semester und behalte deine ECTS im Blick.</h6>
    </div>

    <div class="moduleplanner-grid">

        <div class="semester-range">
            <mat-card appearance="outlined">
                <div class="semester-card-header">
                    <div>
                        <mat-card-header>
                            <mat-card-title> Semester Titel</mat-card-title>
                            <mat-card-subtitle>Aktuelles Studienjahr</mat-card-subtitle>
                        </mat-card-header>
                    </div>
                
                    <mat-card-actions>
                        <button mat-stroked-button>+ Modul hinzufügen</button>
                    </mat-card-actions>
                </div>

                <mat-card-content>
                    <!-- Hier kommen später die Module rein-->
                </mat-card-content>
            </mat-card>
        </div>

            <div class="module-list-range">

                <mat-card appearance="outlined">
                    <mat-card-header>
                        <mat-card-subtitle> Modulkatalog</mat-card-subtitle>
                        <mat-card-title>Alle verfügbaren Module</mat-card-title>
                    </mat-card-header>

                    <mat-card-content>
                        <mat-form-field appearance="outline" class="suchfeld">
                            <input matInput type="text" placeholder="Modul suchen...">
                        </mat-form-field>
                    </mat-card-content>
                </mat-card>


                
            </div>
        
    </div>


</div>
